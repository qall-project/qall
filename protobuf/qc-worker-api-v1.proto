syntax = "proto3";

package qc_worker_api_v1;

import "google/api/annotations.proto";

option go_package = "internal/server/protobuf/qc_worker_api_v1";

service Api {
  // Initialize a quantum execution context.
  rpc CreateContext(CreateContextRequest)
      returns (QuantumContext);

  // Execute a quantum program.
  rpc Run(RunRequest)
      returns (RunResponse);

  // Close an execution context and release associated resources.
  rpc CloseContext(CloseContextRequest)
      returns (QuantumContext);

  // Optional health/capability discovery.
  rpc GetCapabilities(GetCapabilitiesRequest)
      returns (Capabilities);
}

message Error {
  enum Code {
    UNKNOWN_ERROR = 0;
    INVALID_PROGRAM = 1;
    UNSUPPORTED_FORMAT = 2;
    INVALID_RESOURCE = 3;
    SESSION_EXPIRED = 4;
    QPU_UNAVAILABLE = 5;
    PROVIDER_ERROR = 6;
    EXECUTION_FAILED = 7;
  }

  Code code = 1;

  string message = 2;
}

message QuantumContext {
  // Unique identifier generated by Qorus.
  string id = 1;

  // Logical resource selected for the task.
  string resource = 2;

  // Provider owning the resource.
  string provider = 3;

  // Arbitrary execution configuration.
  map<string, string> configuration = 5;

  // Metadata attached by Qorus.
  map<string, string> metadata = 6;
}

message CreateContextRequest {
  string resource = 1;

  map<string, string> configuration = 2;

  map<string, string> metadata = 3;
}

message CreateContextResponse {
  QuantumContext context = 1;

  Error error = 2;
}

message RunRequest {
  QuantumProgram program = 1;

  QuantumProgramParameters parameters = 2;

  QuantumContext context = 3;
}

message RunResponse {
  QuantumProgramResult result = 1;

  QuantumContext context = 2;

  Error error = 3;
}

message QuantumProgram {
  string format = 1;
  string version = 2;
  bytes payload = 3;
}

message QuantumProgramParameters {
  string format = 1;
  string version = 2;
  bytes payload = 3;
}

message QuantumProgramResult {
  string format = 1;
  string version = 2;
  bytes payload = 3;
}

message GetCapabilitiesRequest {}

message Capabilities {
  string provider = 1;

  string input_format = 2;

  string output_format = 3;
}

message CloseContextRequest {
  QuantumContext context = 1;
}