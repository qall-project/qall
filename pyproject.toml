[project]
name = "qall"
version = "0.1.10"
description = "A pythonic tool for modern hybrid and quantum workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "cloudpickle==3.1.2",
    "dataclasses-json>=0.6.7",
    "docker>=7.1.0",
    "grpcio>=1.81.1",
    "keyring>=25.7.0",
    "matplotlib>=3.11.0",
    "pyan3>=2.9.0,<3",
    "pyyaml>=6.0.3",
    "qio>=0.2.2",
    "rustworkx==0.17.1",
    "typer>=0.26.7",
    "lmdb>=2.3.0",
    "retry==0.9.2",
    "fsspec>=2025.6.0",
    "s3fs>=2025.6.0",
    "gcsfs>=2025.6.0",
    "adlfs>=2025.6.0",
    "scaleway-qaas-client>=0.1.0",
    "qall-registry-client>=0.1.0",
    "qall-daemon-client>=0.1.3",
]

### Dependencies ###
[dependency-groups]
dev = [
    "black>=26.1.0",
]
test = [
    "pytest>=9.1.0",
    "pytest-progress>=1.4.0",
]

[tool.pytest.ini_options]
markers = [
    "minio: requires a reachable MinIO instance (see infrastructure/local/docker-compose.yml)",
    "daemon_integration: requires a running qall daemon reachable at localhost:50053",
]

### CLI Tool ###
[project.scripts]
qall = "qall.cli.main:cli"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qall"
module-root = ""
data = ["qall/data"]
