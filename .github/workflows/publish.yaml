name: Deploy to PyPi

on:
  push:
    branches:
      - main

jobs:
  publish:
    permissions:
      contents: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools-scm

    - name: Get version
      id: version
      run: |
        version=$(sed -n 's/^ *version.*=.*"\([^"]*\)".*/\1/p' pyproject.toml)
        echo "version=$version" >> $GITHUB_ENV
        echo "Version : $version"

    - name: Build package
      run: python -m build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@v1.5.0
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Log in to Scaleway Container Registry
      uses: docker/login-action@v3
      with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.DOCKER_REGISTRY_SECRET_KEY }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push qall-base
      uses: docker/build-push-action@v6
      with:
          context: .
          file: docker/qall-runtime.Dockerfile
          push: true
          tags: |
            rg.fr-par.scw.cloud/qall-project/qall-base:${{ env.VERSION }}
            rg.fr-par.scw.cloud/qall-project/qall-base:latest
          labels: |
            org.opencontainers.image.version="v${{ env.VERSION }}"
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    - name: Create and push tag
      run: |
        git tag "v${{ env.VERSION }}" || echo "Tag already exists"
        git push origin "v${{ env.VERSION }}" || echo "Tag already pushed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}